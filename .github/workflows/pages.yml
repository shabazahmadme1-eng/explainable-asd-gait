# Builds the screening app's React front end (angular/frontend) and publishes it on GitHub Pages.
# The Python backend runs separately on a Hugging Face Space; its URL is the repository
# variable VITE_API_URL (Settings → Secrets and variables → Actions → Variables).
name: Deploy screening app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["angular/frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - run: cp dist/index.html dist/404.html   # deep links (/report, /learn) fall back to the app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: angular/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
